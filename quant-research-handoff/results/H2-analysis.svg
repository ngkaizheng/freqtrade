<text x="460" y="534" font-size="10.5" fill="#555" font-weight="normal">15</text>
<text x="610" y="534" font-size="10.5" fill="#555" font-weight="normal">155</text>
<text x="760" y="534" font-size="10.5" fill="#d62728" font-weight="bold">15</text>
<text x="96" y="558" font-size="10.5" fill="#333">2007-2009 金融危机</text>
<text x="310" y="558" font-size="10.5" fill="#555" font-weight="normal">未减仓</text>
<text x="460" y="558" font-size="10.5" fill="#555" font-weight="normal">22</text>
<text x="610" y="558" font-size="10.5" fill="#555" font-weight="normal">56</text>
<text x="760" y="558" font-size="10.5" fill="#d62728" font-weight="bold">22</text>
<text x="96" y="582" font-size="10.5" fill="#333">2020 新冠</text>
<text x="310" y="582" font-size="10.5" fill="#555" font-weight="normal">未减仓</text>
<text x="460" y="582" font-size="10.5" fill="#555" font-weight="normal">6</text>
<text x="610" y="582" font-size="10.5" fill="#555" font-weight="normal">未减仓</text>
<text x="760" y="582" font-size="10.5" fill="#d62728" font-weight="bold">6</text>
<text x="96" y="606" font-size="10.5" fill="#333">2022 加息熊市</text>
<text x="310" y="606" font-size="10.5" fill="#555" font-weight="normal">未减仓</text>
<text x="460" y="606" font-size="10.5" fill="#555" font-weight="normal">13</text>
<text x="610" y="606" font-size="10.5" fill="#555" font-weight="normal">50</text>
<text x="760" y="606" font-size="10.5" fill="#d62728" font-weight="bold">13</text>
<text x="96" y="634" font-size="10.5" fill="#666">（数字 = 峰值之后第几个交易日首次减仓；H2 与 B 完全相同 → 快信号确实生效）</text>
<text x="96" y="654" font-size="10.5" fill="#a00">但 2020 新冠中 H2 谷底暴露 75% vs B 的 50%（MA50 未确认）→ 保护弱于 B</text>
<text x="80" y="822" font-size="13.5" font-weight="bold" fill="#a00">★ 判定：不支持 H2（机制假设 0/4）</text>
<text x="80" y="844" font-size="11.5" fill="#333">· 换手比 B 仅降 23-31%（预注册阈值 30%）—— 多数资产未达标</text>
<text x="80" y="864" font-size="11.5" fill="#333">· 回撤差(D-B) 在 Validation 层 +1.27~+5.63pp（预注册阈值 3pp）—— 多数资产恶化</text>
<text x="80" y="884" font-size="11.5" fill="#333">· H2 指标整体落在 B 与 C 之间：4/4 资产在两层都不满足机制假设</text>
<text x="80" y="904" font-size="11.5" fill="#333">· 但快信号确实生效：崩盘中 H2 与 B 的首次减仓时点完全相同</text>
<text x="80" y="924" font-size="11.5" fill="#333">· 根因：Close&lt;MA200 的日子里 75-78% 时 MA50 也已跌破 → 分层几乎不展开</text>

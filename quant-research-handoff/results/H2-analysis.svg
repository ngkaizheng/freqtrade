<text x="96" y="514" font-size="10.5" font-weight="bold" fill="#555">Episode                     BH   Close→50%    MA50→50%      H2分层</text>
<text x="96" y="534" font-size="10.5" fill="#333">2000-2002 互联网泡沫</text>

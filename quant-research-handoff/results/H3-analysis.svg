<text x="80" y="768" font-size="13.5" font-weight="bold" fill="#a00">★ 判定：不支持 H3（三个类别在两层均 0/4）</text>
<text x="80" y="790" font-size="11.5" fill="#333">· 条件子样本：触发组未来 63 日收益反而更高（+0.01 ~ +8.72pp），方向与假设相反</text>
<text x="80" y="810" font-size="11.5" fill="#333">· 即：这些信号标记的是「已下跌后的反弹区」，而非「进一步下跌区」</text>
<text x="80" y="830" font-size="11.5" fill="#333">· 置换检验：Validation 层 12 个组合中仅 1 个超出 95% 分位（约等于随机）</text>
<text x="80" y="850" font-size="11.5" fill="#333">· 因此叠加层带来的回撤差异，无法与「随机减仓的机械效果」区分</text>
<text x="80" y="870" font-size="11.5" fill="#333">· 唯二超出者为 QQQ/广度（97.5% / 96.5%），但其他三个资产均未超出</text>
